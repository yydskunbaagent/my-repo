# 受控解析器（unbound）：扫描网段唯一可用的 DNS 服务。
# 语义依据：方案 §5.2 与 docs/tasks/TASK-002.md。
#
#   - 监听 10.10.0.53，仅服务扫描网段 10.10.0.0/24；
#   - 只解析 scope 内域名：对根 "." 默认 refuse，scope 域名用 transparent 放行，
#     其余一律 REFUSED——与 scope 的 on_unparsed_target: block 同一口径，
#     防止借解析器做 DNS 隧道外送；
#   - 转发模式：上游为占位地址，部署时替换为授权的递归上游。
#
# 与 nftables 的关系：扫描容器的出站 53 只允许到本解析器
# （deploy/nftables/scan-node.nft）；本解析器自身对上游的查询不经过该策略的
# 放行面，部署时需按 scan-node.nft 尾部"部署决策点"选型（a/b/c）。

server:
  # 监听与访问控制：仅服务扫描网段
  interface: 10.10.0.53
  port: 53
  do-udp: yes
  do-tcp: yes
  access-control: 10.10.0.0/24 allow
  access-control: 0.0.0.0/0 refuse
  access-control: ::0/0 refuse

  # 默认拒绝：根域 refuse，白名单域 transparent 放行。
  # transparent 作用于整个子树（含子域）：include_subdomains: true 的目标
  # 无需逐子域列条目；include_subdomains: false 的目标即使子域在此可解析，
  # 解析出的 IP 也不会进 nftables 动态集合，扫描流量仍会被 forward 链丢弃
  # ——DNS 层放行宽一点是安全的，网络层是硬边界。
  # unbound 的 local-zone 类型中没有 domain-transparent，整树放行即 transparent。
  local-zone: "." refuse

  # ---- scope 域名白名单：部署时由脚本从 scope.yaml 生成（示例）----
  # kind: domain 的每个 target 生成一行：local-zone: "<normalized>" transparent
  local-zone: "yyds520.online" transparent
  # ---- 白名单结束 ----

  verbosity: 1
  hide-identity: yes
  hide-version: yes

forward-zone:
  name: "."
  # 占位上游：部署时替换为授权的递归上游（建议 DoT 上游；
  # 明文 53 上游的查询内容对链路可见，见 scan-node.nft 部署决策点 b）
  forward-addr: 1.1.1.1
  forward-addr: 8.8.8.8
